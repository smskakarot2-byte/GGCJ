version: "1"

databases:
  - name: gcuf-db
    databaseName: gcuf_portal
    user: gcuf_user
    plan: free

services:
  # Single Unified Web Service (Backend + Frontend)
  - type: web
    name: gcuf-unified
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @workspace/gcuf-web run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gcuf-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        # Set this to your Render URL (e.g., https://gcuf-unified.onrender.com)
        # or leave empty to allow all origins in development
        sync: false
