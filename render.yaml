version: "1"

databases:
  - name: gcuf-db
    databaseName: gcuf_portal
    user: gcuf_user
    plan: free

services:
  # 1. Backend Express API Server
  - type: web
    name: gcuf-api-server
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm --filter api-server build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gcuf-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: FRONTEND_URL
        fromStaticSite:
          name: gcuf-web
          property: url

  # 2. Frontend React/Vite Website
  - type: static
    name: gcuf-web
    plan: free
    buildCommand: pnpm install && pnpm --filter gcuf-web build
    staticPublishPath: artifacts/gcuf-web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gcuf-api-server
          property: url
