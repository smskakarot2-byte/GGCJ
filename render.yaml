version: "1"

databases:
  - name: gcuf-db
    databaseName: gcuf_portal
    user: gcuf_user
    plan: free

services:
  # 1. Backend Express API Server
  - type: web
    name: gcuf-api-server
    runtime: node
    plan: free
    buildCommand: pnpm install && cd artifacts/api-server && pnpm run build
    startCommand: cd artifacts/api-server && pnpm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gcuf-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://gcuf-web.onrender.com

  # 2. Frontend React/Vite Website (Static)
  - type: web
    name: gcuf-web
    runtime: static
    buildCommand: pnpm install && pnpm --filter gcuf-web build
    staticPublishPath: artifacts/gcuf-web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://gcuf-api-server.onrender.com
