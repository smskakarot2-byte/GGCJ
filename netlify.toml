[build]
  command = "pnpm install && pnpm --filter @workspace/gcuf-web run build"
  publish = "artifacts/gcuf-web/dist/public"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
